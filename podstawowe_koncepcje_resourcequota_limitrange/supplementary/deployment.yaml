apiVersion: apps/v1
kind: Deployment
metadata:
  name: quota-demo
  namespace: quota-demo
spec:
  replicas: 4
  selector:
    matchLabels:
      app: quota-demo
  template:
    metadata:
      labels:
        app: quota-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.3
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            limits:
              memory: "128Mi"
              cpu: "150m"
            requests:
              memory: "64Mi"
              cpu: "100m"

