# kubectl create --dry-run=server -f supplementary/pod-ratio-invalid.yaml
apiVersion: v1
kind: Pod
metadata:
  name: pod-ratio-invalid
  namespace: quota-demo
spec:
  containers:
    - name: nginx
      image: nginx:1.27.3
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: "500m"
          memory: 128Mi
