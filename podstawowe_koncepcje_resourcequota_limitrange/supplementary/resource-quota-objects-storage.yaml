apiVersion: v1
kind: ResourceQuota
metadata:
  name: objects-storage-budget
  namespace: quota-demo
spec:
  hard:
    services: "5"
    secrets: "10"
    configmaps: "10"
    count/jobs.batch: "5"
    persistentvolumeclaims: "4"
    requests.storage: 20Gi
    # Nazwa StorageClass jest przykładowa; dopasuj ją do klastra.
    fast.storageclass.storage.k8s.io/requests.storage: 10Gi
    fast.storageclass.storage.k8s.io/persistentvolumeclaims: "2"
